[project]
name = "autocad-mcp"
version = "0.1.0"
description = "AutoCAD 2027 for Mac integration through the Model Context Protocol (Live GUI + AcCoreConsole + ezdxf)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Charlie"}
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "ezdxf>=1.3.0"
]

[project.scripts]
autocad-mcp = "autocad_mcp.server:main"

[project.entry-points.mcp]
autocad = "autocad_mcp.server:mcp"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
